{% extends "base.html" %}{% block content %}<section class="hero compact"><p class="eyebrow">COMMUNITY POLL</p><h1>VOTING <em>RESULTS</em></h1></section>{% if week %}<h2><a href="/week/{{week.week_number}}">{{week.title}}</a></h2><p class="muted">{{total}} total votes</p>{% for c,v in rows %}<div class="result-row"><div class="result-label"><strong><a href="/contestant/{{c.id}}">{{c.name}}</a></strong><span>{{v}} · {{(v*100/total)|round(1) if total else 0}}%</span></div><div class="track"><div class="fill" style="width:{{(v*100/total) if total else 0}}%"></div></div></div>{% endfor %}{% else %}<p>No results yet.</p>{% endif %}{% endblock %}
